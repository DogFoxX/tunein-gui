[package]
name = "tunein-gui"
version = "0.1.7"
description = "Unofficial GUI for TuneinCrew - Create custom radio stations for The Crew 2014"
authors = ["DogFoxX"]
license = "GPL-3.0"
repository = "https://github.com/DogFoxX/tunein-gui/"
edition = "2024"
rust-version = "1.90.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = {version = "2", features = ["watch"] }
image = "0.25.8"
image_dds = "0.7.2"
base64 = "0.22.1"
ddsfile = "0.5.2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
symphonia = { version = "0.5.4", features = ["mp3", "flac", "wav", "vorbis", "aiff"] }
replaygain = "1.0.1"
tauri-plugin-shellx = "2.0.16"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
